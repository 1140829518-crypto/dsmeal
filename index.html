<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#54a5dd"><title>想吃点啥？</title><link rel="stylesheet" href="./style.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script></head><body><div class="app">
<header class="hero"><div class="heroin"><div class="head"><div class="avatar">👩‍🍳</div><div><h1>想吃点啥？</h1><p>两个人，也要好好吃饭</p></div><div class="sync" id="sync" onclick="setRoom()">未设置共享码</div></div><div class="search">🔎<input id="search" placeholder="搜索菜名或食材…"></div></div></header>
<section class="filters"><div class="wrap" style="padding:0"><div class="row" id="cats"></div><div class="row" id="meats"></div></div></section>
<main class="wrap"><div class="sectionhead"><h2>今天吃什么</h2><span id="count"></span></div><div class="grid" id="grid"></div></main>
<nav class="nav"><button onclick="window.scrollTo({top:0,behavior:'smooth'})"><b>⌂</b>菜谱</button><button onclick="chooser()"><b>🎲</b>吃什么</button><button onclick="openMenu()"><span class="badge" id="menubadge">0</span><b>🍽️</b>今日菜单</button></nav>
<div class="overlay" id="detailOv"><section class="modal" id="detail"></section></div>
<div class="overlay" id="menuOv"><section class="modal"><button class="close" onclick="closeOv('menuOv')">×</button><h2>🍽️ 今日菜单</h2><div id="menuBody"></div></section></div>
<div class="overlay" id="chooseOv"><section class="modal chooser"><button class="close" onclick="closeOv('chooseOv')">×</button><h2>🎲 帮我选今晚吃什么</h2><p>适合两个人的家常搭配</p><div class="choices"><button onclick="comboN=2;makeCombo()">2菜</button><button onclick="comboN=3;makeCombo()">3菜</button><button onclick="comboN=4;makeCombo()">3菜1汤</button></div><div class="result" id="combo"></div><button class="primary" onclick="makeCombo()">🔄 换一组</button> <button class="primary" onclick="addCombo()">✓ 加入今日菜单</button></section></div>
</div><script src="./app.js"></script></body></html>
